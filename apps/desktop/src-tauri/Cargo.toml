[package]
name = "storycode"
version = "0.1.0"
description = "StoryCode - AI novel writing IDE"
authors = ["StoryCode"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "storycode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net"] }
reqwest = { version = "0.13", features = ["json", "stream", "rustls", "rustls-native-certs"], default-features = false }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store"] }
sha2 = "0.11"
thiserror = "2"
futures-util = "0.3"
scraper = "0.29"
tauri-plugin-opener = "2"

[features]
# Used by `tauri dev`/`tauri build` to enable the custom protocol.
custom-protocol = ["tauri/custom-protocol"]
